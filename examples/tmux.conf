# Minimal tmux.conf showing how to wire HunterMark.
# Drop the `set -g @plugin` line into your existing tmux.conf alongside
# your other plugins, then add the status-right snippet to see the chips.

# --- prerequisites ---
set -g @plugin 'tmux-plugins/tpm'

# --- HunterMark ---
set -g @plugin '<your-fork>/huntermark'

# Optional: customize the chord set
# set -g @huntermark-chord-add 't'
# set -g @huntermark-chord-remove 'M-t'
# set -g @huntermark-chord-help 'M-h'
# set -g @huntermark-max-chips 3
# set -g @huntermark-style-index 'fg=brightblack'
# set -g @huntermark-style-value 'fg=yellow,bold'

# --- status bar widget ---
# Recommended: read the chip from the @huntermark-bar user option. Mutations
# push to this option directly, so removals/edits reflect instantly (no 5s
# status-interval cache lag).
set -g status-right "#{@huntermark-bar} %H:%M %d-%b "
set -g status-right-length 180

# Legacy (still works): poll the script via #(); refreshes once per
# status-interval. Use this only if your tmux is too old for #{@user-option}.
# set -g status-right "#(/home/$USER/.config/tmux/plugins/huntermark/scripts/mark-status.sh) %H:%M %d-%b "

# --- keep this last so TPM loads after all @plugin declarations ---
run '~/.config/tmux/plugins/tpm/tpm'
